name: ci/cd

on:
  workflow_dispatch:
  push:
    branches: [ main, 'release/**', 'task/**', 'feature/**', 'epic/**']
    tags: ['**']
  pull_request:
    branches: [ main, 'release/**', 'task/**', 'feature/**', 'epic/**']
  schedule:
  - cron: "23 4 * * *"

jobs:

  newer-builds:
    name: Erlang ${{ matrix.otp-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        otp-version: ['28', '27', '26']

    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp-version }}
        rebar3-version: '3.25'
    - name: Check rebar3 Version
      run: DEBUG=1 rebar3 --version
    - name: Compile
      run: rebar3 compile
#    - name: Xref Checks
#      run: rebar3 xref
#    - name: Dialyzer
#      run: rebar3 dialyzer
    - name: Compile Tests
      run: rebar3 as test compile
    - name: Run Unit Tests
      run: rebar3 as test eunit
    - name: Run Proper Tests
      run: rebar3 as test do proper -c
    - name: Check Coverage
      run: rebar3 as test cover -v --min_coverage=0
    - name: Get Supported 'new' Templates
      run: make test-new
    - name: Check New LFE Library Project
      run: make test-new-lfe-lib
    - name: Check New LFE Main Project
      run: make test-new-lfe-main
    - name: Check New LFE/OTP Application Project
      run: make test-new-lfe-app
    - name: Check New LFE escript Project
      run: make test-new-lfe-escript
    - name: Check New LFE/OTP Release Project
      run: make test-new-lfe-release
   # XXX Startup keeps hanging in Github Actions ... probably need to do somehting
   #     different.
   # - name: Start LFE/OTP Release
   #   run: cd priv/testing/example-release && rebar3 lfe run-release start && sleep 5
   # - name: Ping LFE/OTP Release
   #   run: cd priv/testing/example-release && rebar3 lfe run-release ping
    - name: Check versions Command Output
      run: make test-versions-cmd
    - name: Check clean Command
      run: make test-clean-cmd
    - name: Check clean-build Command
      run: make test-clean-build-cmd

  older-builds:
    name: Erlang ${{ matrix.otp-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        otp-version: ['25', '24']

    steps:
    - uses: actions/checkout@v4
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp-version }}
        rebar3-version: '3.22'
    - name: Check rebar3 Version
      run: DEBUG=1 rebar3 --version
    - name: Compile
      run: rebar3 compile
#    - name: Xref Checks
#      run: rebar3 xref
#    - name: Dialyzer
#      run: rebar3 dialyzer
    - name: Compile Tests
      run: rebar3 as test compile
    - name: Run Unit Tests
      run: rebar3 as test eunit
    - name: Run Proper Tests
      run: rebar3 as test do proper -c
    - name: Check Coverage
      run: rebar3 as test cover -v --min_coverage=0
    - name: Get Supported 'new' Templates
      run: make test-new
    - name: Check New LFE Library Project
      run: make test-new-lfe-lib
    - name: Check New LFE Main Project
      run: make test-new-lfe-main
    - name: Check New LFE/OTP Application Project
      run: make test-new-lfe-app
    - name: Check New LFE escript Project
      run: make test-new-lfe-escript
    - name: Check New LFE/OTP Release Project
      run: make test-new-lfe-release
   # XXX Startup keeps hanging in Github Actions ... probably need to do somehting
   #     different.
   # - name: Start LFE/OTP Release
   #   run: cd priv/testing/example-release && rebar3 lfe run-release start && sleep 5
   # - name: Ping LFE/OTP Release
   #   run: cd priv/testing/example-release && rebar3 lfe run-release ping
    - name: Check versions Command Output
      run: make test-versions-cmd
    - name: Check clean Command
      run: make test-clean-cmd
    - name: Check clean-build Command
      run: make test-clean-build-cmd
